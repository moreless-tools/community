name: Report a bug
description: Something did not work as expected.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Thanks for the report. This issue will be public, so remove personal details and use a non-sensitive sample. For suspected security problems, email hello@moreless.tools privately."
  - type: input
    id: tool
    attributes:
      label: Tool or page
      description: Paste the page URL or name the tool.
      placeholder: "Image Converter"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: What did you do, what happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Safari on macOS, Chrome on Android..."
  - type: textarea
    id: sample
    attributes:
      label: Screenshot or non-sensitive example
      description: Optional. Please do not upload private documents, passwords or access tokens.
